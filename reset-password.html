<!DOCTYPE html> <html lang="vi"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Đặt lại mật khẩu - Góc Chia Sẻ</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; background: #f6f7fb; color: #333; } .box { width: 100%; max-width: 420px; margin: 20px; padding: 32px; background: white; border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); } h1 { margin-top: 0; text-align: center; } p { text-align: center; color: #777; line-height: 1.5; } input { width: 100%; padding: 13px 14px; border: 1px solid #ddd; border-radius: 10px; margin-top: 10px; font-size: 15px; } button { width: 100%; border: none; border-radius: 10px; padding: 13px; margin-top: 18px; cursor: pointer; font-size: 15px; background: #333; color: white; } #message { margin-top: 15px; text-align: center; font-size: 14px; } </style> </head> <body> <div class="box"> <h1>Đặt lại mật khẩu</h1> <p> Nhập mật khẩu mới cho tài khoản quản trị Góc Chia Sẻ. </p> <input type="password" id="password" placeholder="Mật khẩu mới" > <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" > <button onclick="updatePassword()"> Đặt mật khẩu </button> <div id="message"></div> </div> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script> const SUPABASE_URL = "https://hoehscuamkbnzjdzhzbs.supabase.co"; const SUPABASE_KEY = "sb_publishable_rRxiCGRButFCBglYrBZZwg_NwVzDWPT"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); async function updatePassword() { const password = document.getElementById("password").value; const confirmPassword = document.getElementById("confirmPassword").value; const message = document.getElementById("message"); message.textContent = ""; if (!password || !confirmPassword) { message.textContent = "Vui lòng nhập đầy đủ thông tin."; return; } if (password.length < 6) { message.textContent = "Mật khẩu cần có ít nhất 6 ký tự."; return; } if (password !== confirmPassword) { message.textContent = "Mật khẩu nhập lại không khớp."; return; } message.textContent = "Đang cập nhật mật khẩu..."; const { error } = await supabaseClient.auth.updateUser({ password: password }); if (error) { console.error(error); message.textContent = "Không thể cập nhật mật khẩu. Link khôi phục có thể đã hết hạn."; return; } message.textContent = "Đặt mật khẩu thành công! Bạn có thể quay lại trang quản trị để đăng nhập."; } </script> </body> </html>
